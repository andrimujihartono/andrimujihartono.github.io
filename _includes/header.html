  <header class="container py-3">
    <nav class="navbar nav-box" aria-label="Navigasi utama">
      <a class="navbar-brand" href="/">AMH</a>

      <!-- Tombol hamburger: hanya tampil di mobile, membuka <dialog> via Invoker Commands -->
      <button class="navbar-toggler nav-btn" type="button"
              commandfor="mainNav" command="show-modal"
              aria-controls="mainNav" aria-label="Buka menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>

      <!-- Menu: drawer di mobile, inline di desktop (diatur CSS di atas) -->
      <dialog class="drawer drawer-end nav-drawer" tabindex="-1" id="mainNav" aria-labelledby="mainNavLabel">
        <div class="drawer-header">
          <h5 class="drawer-title" id="mainNavLabel">Menu</h5>
          <button type="button" class="btn-close" commandfor="mainNav" command="close" aria-label="Tutup"></button>
        </div>
        <div class="drawer-body">
          <ul class="navbar-nav">
             {% for category in site.categories %}
            {% capture cat_name %}{{ category | first }}{% endcapture %} 
            <!-- ({{ category | last | size }}) -->
              <li class="nav-item">
                <a class="nav-link nav-btn text-capitalize" href="{{ site.baseurl }}/categories/{{ cat_name }}" id="aa">{{ cat_name }}
                  </a>
              </li>
          
            {% endfor %}

            <!-- <li class="nav-item"><a class="nav-link nav-btn active" href="/project/" aria-current="page">Project</a></li>
            <li class="nav-item"><a class="nav-link nav-btn" href="/resume/">Resume</a></li>
            <li class="nav-item"><a class="nav-link nav-btn" href="/travel/">Travel</a></li>
            <li class="nav-item"><a class="nav-link nav-btn" href="/blog/">Blog</a></li> -->
          </ul>
        </div>
      </dialog>
    </nav>
  </header>
